services:
  # https://hub.docker.com/_/mariadb#-via-docker-compose
  db:
    image: mariadb:lts-noble
    container_name: flask-mariadb-db
    volumes:
      - ./instance/db:/var/lib/mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}

  app:
    image: flask-mariadb
    build:
      dockerfile: Dockerfile
    container_name: flask-mariadb-app
    volumes:
      - .:/flask-app
    ports:
      - 5000:5000
    depends_on:
      - db
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PORT: 3306
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
