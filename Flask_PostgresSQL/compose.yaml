services:
  # https://hub.docker.com/_/postgres#-via-docker-compose
  db:
    image: postgres:trixie
    container_name: flask-postgres-db
    volumes:
      - ./instance/db:/var/lib/postgresql
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  app:
    image: flask-postgres
    build:
      dockerfile: Dockerfile
    container_name: flask-postgres-app
    volumes:
      - .:/flask-app
    ports:
      - 5000:5000
    depends_on:
      - db
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
